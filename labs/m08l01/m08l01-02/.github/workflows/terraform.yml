# Infrastructure as Code with Terraform — lesson m08l01 — Running Terraform In CI
# https://learnsome.tech/courses/terraform-course/watch?lesson=m08l01
# © LearnSome.tech
name: terraform
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform plan -out=tfplan
